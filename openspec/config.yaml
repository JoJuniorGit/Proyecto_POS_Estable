schema: spec-driven

# Strict TDD resolved by sdd-init from real workspace evidence (2026-09-14).
# No single workspace-level test command runs every in-scope project from the
# workspace root: CI (.github/workflows/ci.yml) runs two independent commands
# (`dotnet test ...` and `npm test` in Web.Frontend). Per the init decision
# gates this fails closed to false; downstream runs each project-local command.
strict_tdd: false

context: |
  Project: CommandCenter POS (V0.1) - single-branch point-of-sale system.
  Backend: .NET 10 (C# 13), layered (Core, Sales.Module, Inventory.Module, Logistics.Module, Backend.API) plus UpdaterService.
  Clients: WPF desktop (CommunityToolkit.Mvvm) and React 19 + Vite 8 web (Web.Frontend).
  Data: PostgreSQL 16 via EF Core/Npgsql; money in decimal only; BCV rate snapshots immutable.
  Conventions: AGENTS.md, docs/coding-guidelines-core.md - no comments unless asked; no inline JSX styles.
  Tests: xUnit + Moq + WebApplicationFactory + coverlet (CommandCenter.Tests); node --test + oxlint (Web.Frontend).

testing:
  strict_tdd_mode: disabled
  detected: 2026-09-14
  workspace_wide_test_command: none
  rationale: >
    No explicit workspace-level command covers every in-scope project from the
    workspace root. CI runs two independent commands, so Strict TDD fails closed
    to false and each project command below is run on its own.
  test_layers:
    - project: CommandCenter.Tests
      unit: true
      integration: true
      e2e: false
    - project: Web.Frontend
      unit: true
      integration: false
      e2e: false
  coverage:
    provider: coverlet (XPlat Code Coverage, cobertura XML)
    runsettings: CommandCenter.Tests/coverage.runsettings
    gate_command: python scripts/check-coverage.py <coverage.cobertura.xml>
    measurement: domain line-rate, excludes *.Migrations.* (verified by MigratedSchema smoke)
    thresholds:
      Core: 0.70
      Sales.Module: 0.80
      Inventory.Module: 0.72

projects:
  - path: CommandCenter.Tests
    stack: .NET 10 / xUnit
    test_command: dotnet test CommandCenter.Tests/CommandCenter.Tests.csproj
    framework: xUnit + Moq + WebApplicationFactory + coverlet
    coverage_command: >
      dotnet test CommandCenter.Tests/CommandCenter.Tests.csproj
      --collect:"XPlat Code Coverage" --settings CommandCenter.Tests/coverage.runsettings
    requires: TEST_POSTGRES_CONNECTION (optional; real Postgres integration tests fail in CI without it)
    quality:
      linter: none (Roslyn analyzers enforced via TreatWarningsAsErrors)
      type_checker: dotnet build (Nullable enabled)
      formatter: none
  - path: Web.Frontend
    stack: React 19 + Vite 8 (Node 22)
    test_command: npm test
    framework: node --test with esbuild JSX loader
    quality:
      linter: npm run lint (oxlint)
      type_checker: none
      formatter: none
    build_command: npm run build

rules:
  proposal:
    - Name the affected in-scope project(s) and their project-local test command.
    - Include a rollback plan for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Document architecture decisions with rationale.
    - Preserve sales-history snapshot immutability (rules.md) and decimal-only money.
  tasks:
    - Group by phase with hierarchical numbering.
    - Reference the specific spec scenarios each test task covers.
  apply:
    guidelines:
      - Follow AGENTS.md and docs/coding-guidelines-core.md.
      - Do not add explanatory comments unless explicitly requested.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: dotnet build CommandCenter.slnx --configuration Release
    coverage_threshold: 0.70
  archive:
    - Warn before merging destructive (REMOVED) deltas.
