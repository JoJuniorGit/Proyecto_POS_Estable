name: CI Pipeline

on:
  push:
    branches: [ main, develop, V0.15 ]
  pull_request:
    branches: [ main, develop, V0.15 ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore CommandCenter.slnx

      - name: Build Solution (TreatWarningsAsErrors)
        run: dotnet build CommandCenter.slnx --no-restore --configuration Release

      - name: Run Test Suite & Collect Code Coverage
        # 8.9-L2: TEST_POSTGRES_CONNECTION es un contrato de CI; sin ella PostgresRealIntegrationTests
        # falla en pipelines (GITHUB_ACTIONS=true), nunca hace silent-pass.
        # 8.9-L5: coverage.runsettings restringe la medicion a las capas criticas de dominio
        # (Sales.Module, Inventory.Module, Core) segun politica Rev 8.2.
        env:
          TEST_POSTGRES_CONNECTION: "Host=localhost;Port=5432;Database=pos_test;Username=postgres;Password=testpass"
        run: dotnet test CommandCenter.Tests/CommandCenter.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --settings CommandCenter.Tests/coverage.runsettings --verbosity normal

      # 8.9-L5: gate de cobertura por capa (scripts/check-coverage.py).
      # Core >= 70% (politica cumplida); Sales.Module/Inventory.Module = baseline anti-regresion
      # con la deuda hacia 70% documentada en docs/reporte.txt Rev 8.11.
      - name: Enforce Coverage Gate (by layer, >= thresholds)
        if: always()
        run: |
          report=$(find ./CommandCenter.Tests/TestResults -name 'coverage.cobertura.xml' | head -n 1)
          echo "Coverage report: ${report}"
          if [ -z "${report}" ]; then
            echo "::error::No se generó el reporte de cobertura en CI (gate de cobertura insuficientemente medible)."
            exit 1
          fi
          python scripts/check-coverage.py "${report}"

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: ./CommandCenter.Tests/TestResults/**/coverage.cobertura.xml

  frontend-lint-and-test:
    name: Frontend Lint & Test (React 19 + Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: Web.Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: Web.Frontend

      - name: Run Linter (Oxlint)
        run: npm run lint
        working-directory: Web.Frontend

      - name: Run Frontend Tests
        run: npm test
        working-directory: Web.Frontend

      # 8.9-L5: gate de build del bundle (evita que el bundle Web de Backend.API/wwwroot quede stale).
      - name: Build Frontend Bundle
        run: npm run build
        working-directory: Web.Frontend
